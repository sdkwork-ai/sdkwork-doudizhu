# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/doudizhu/webserver.pid;
error_log /var/log/sdkwork/doudizhu/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name doudizhu-staging.sdkwork.com doudizhu-staging.birdcoder.com doudizhu-staging.dtupay.com doudizhu-staging.sdkwork.cn doudizhu-staging.birdcoder.cn doudizhu-staging.dtupay.cn doudizhu-staging.skubc.com doudizhu-staging.skubc.cn doudizhu-staging.zowalk.com doudizhu-staging.zowalk.cn doudizhu-staging.offer86.com doudizhu-staging.offer86.cn doudizhu-staging.86offer.com doudizhu-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
