# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/doudizhu/webserver.pid;
error_log /var/log/sdkwork/doudizhu/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name doudizhu-test.sdkwork.com doudizhu-test.birdcoder.com doudizhu-test.dtupay.com doudizhu-test.sdkwork.cn doudizhu-test.birdcoder.cn doudizhu-test.dtupay.cn doudizhu-test.skubc.com doudizhu-test.skubc.cn doudizhu-test.zowalk.com doudizhu-test.zowalk.cn doudizhu-test.offer86.com doudizhu-test.offer86.cn doudizhu-test.86offer.com doudizhu-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
