# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/doudizhu/webserver.pid;
error_log /var/log/sdkwork/doudizhu/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name doudizhu-demo.sdkwork.com doudizhu-demo.birdcoder.com doudizhu-demo.dtupay.com doudizhu-demo.noaper.com doudizhu-demo.sdkwork.cn doudizhu-demo.birdcoder.cn doudizhu-demo.dtupay.cn doudizhu-demo.noaper.cn doudizhu-demo.skubc.com doudizhu-demo.skubc.cn doudizhu-demo.zowalk.com doudizhu-demo.zowalk.cn doudizhu-demo.offer86.com doudizhu-demo.offer86.cn doudizhu-demo.86offer.com doudizhu-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/doudizhu/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
